services:
  minecraft:
    image: ivantopgaming/minecraft_server:latest
    container_name: survival
    ports:
      - "25565:25565"
    volumes:
      - ./server:/minecraft
    environment:
      - JVM_OPTS=-Xmx8G -Xms8G
      - CORE_JAR=server.jar
      - DIFFICULTY=hard
      - ALLOW_NETHER=false
      - MOTD=Waiting for players...
      - ONLINE_MODE=false
      - GAME_VERSION=1.21.5
      - CORE_TYPE=purpur
      - ENABLE_LOG4J_PATCH=true
    restart: unless-stopped
    stop_grace_period: 120s
    stdin_open: true
    tty: true